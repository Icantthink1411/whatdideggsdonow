name: Weekly Price Update

on:
  schedule:
    - cron: '0 13 * * 0'  # Every Sunday at 8am CDT (13:00 UTC)
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run price update
        run: python update_prices.py --key ${{ secrets.FRED_API_KEY }}

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Weekly price update - $(date +'%B %d, %Y')"
          git push

